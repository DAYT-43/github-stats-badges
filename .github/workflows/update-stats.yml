name: Update profile stats badges

on:
  schedule:
    - cron: '0 6 * * *'   # ежедневно в 06:00 UTC
  workflow_dispatch:      # ручной запуск

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update stats badges
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OWNER: DAYT-43
        run: python scripts/update_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stars.json contributions.json
          git diff --cached --quiet || git commit -m "chore: update stats badges ($(date -u +%Y-%m-%d))"
          git push